# ==============================================================================
# Warning Configuration
# ==============================================================================

warning:
  # TTC thresholds (seconds)
  ttc:
    # Critical: immediate collision threat
    critical_threshold: 1.5
    # Danger: high risk of collision
    danger_threshold: 3.0
    # Caution: moderate risk
    caution_threshold: 5.0
    # Minimum valid TTC (below this = collision imminent)
    min_valid_ttc: 0.5

  # Risk assessment
  risk:
    # Enable risk level smoothing (prevents flickering)
    enable_smoothing: true
    # Number of frames for smoothing window
    smoothing_window: 5
    # Minimum consecutive frames at risk level before triggering
    min_consecutive_frames: 3

  # Audio alert
  # NOTE: CAUTION intentionally plays no sound (see warning_system.cpp
  # playAudio) — it fires frequently in normal traffic, and production
  # ADAS/FCW products generally reserve audible alerts for DANGER/CRITICAL
  # to avoid alert fatigue. There is no caution_sound key for this reason.
  # (Linux/Jetson uses these .wav paths via aplay; Windows uses Beep() with
  # the critical_freq_hz/danger_freq_hz-style fields in system config instead.)
  audio:
    enabled: true
    sounds_dir: "./sounds/"
    critical_sound: "critical_warning.wav"
    danger_sound: "danger_warning.wav"

  # Visual alert
  visual:
    enabled: true
    # Colors (BGR format)
    color_safe: [0, 255, 0]       # Green
    color_caution: [0, 255, 255]  # Yellow
    color_danger: [0, 165, 255]   # Orange
    color_critical: [0, 0, 255]   # Red
    # Overlay opacity
    overlay_alpha: 0.3
    # Show distance text
    show_distance: true
    # Show TTC text
    show_ttc: true
    # Show speed text
    show_speed: true
